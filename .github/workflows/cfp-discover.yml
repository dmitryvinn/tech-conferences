name: CFP Auto-Discovery

on:
  schedule:
    - cron: '0 7 * * *'   # Daily — 07:00 UTC
  workflow_dispatch:

jobs:
  cfp-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run CFP auto-discovery
        id: discover
        run: |
          node scripts/cfp-auto-discover.mjs 2>&1 | tee cfp-discover-output.txt
          if [ -f scripts/cfp-discoveries.json ]; then
            COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('scripts/cfp-discoveries.json','utf8')).length)")
          else
            COUNT=0
          fi
          echo "new_count=$COUNT" >> $GITHUB_OUTPUT

      - name: Create or update discovery issue
        if: steps.discover.outputs.new_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const discoveries = JSON.parse(fs.readFileSync('scripts/cfp-discoveries.json', 'utf8'));
            if (!discoveries.length) return;

            const top = discoveries.slice(0, 30);
            const rows = top.map(c =>
              `| ${c.name} | ${c.cfpCloseDate || 'TBD'} | ${c.region} | [CFP](${c.cfpUrl}) | [Site](${c.url}) |`
            ).join('\n');

            const body = [
              `## CFP Auto-Discovery Report`,
              ``,
              `Found **${discoveries.length}** new conference(s) with open CFPs not yet tracked.`,
              ``,
              `### Top ${top.length} by CFP Deadline`,
              ``,
              `| Conference | CFP Closes | Region | CFP Link | Website |`,
              `|-----------|-----------|--------|----------|---------|`,
              rows,
              discoveries.length > 30
                ? `\n_...and ${discoveries.length - 30} more. See the full report in workflow artifacts._`
                : '',
              ``,
              `### Region Breakdown`,
              ``,
              ...Object.entries(
                discoveries.reduce((acc, c) => { acc[c.region] = (acc[c.region] || 0) + 1; return acc; }, {})
              ).map(([region, count]) => `- **${region}**: ${count}`),
              ``,
              `_Generated by CFP Auto-Discovery on ${new Date().toISOString().split('T')[0]}._`,
              `_Sources: confs.tech, developers.events_`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cfp-discovery',
              per_page: 1,
            });

            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
                title: `CFP Discovery — ${discoveries.length} new conference(s) found`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `CFP Discovery — ${discoveries.length} new conference(s) found`,
                body,
                labels: ['cfp-discovery'],
              });
            }

      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfp-discoveries-${{ github.run_id }}
          path: |
            scripts/cfp-discoveries.json
            cfp-discover-output.txt
          retention-days: 30
